# RPE1 essential screen (Replogle et al. 2022), SPORE-XL v4.0, PRODUCTION defaults: budget panel, no ghost rescue, escaper-score counts, lognorm hybrid.
# Settings of the RPE1 compatibility gate (test 306, val 153, seed 42, n_top_genes 5000). Run it as ONE command:
#     python spore_xl.py run --config my_rpe1.yaml          (or: sbatch --output=<log folder>/slurm_%j.out slurm/spore_xl.sbatch my_rpe1.yaml)
# Placeholders (the code refuses a config that still holds one; docs/HPC_SETUP.md has the sed commands):
#   <SPORE_ROOT>        the SPORE-XL repository (the protected-gene list)
#   <RPE1_H5AD>         the raw single-cell RPE1 .h5ad (read in place, read-only)
#   <OUTPUT_DIR>        folder that will hold the run folder
#   <SCRATCH_WORK_DIR>  folder for the working files
#   <RUN_LABEL>         a label for this run (each label gets its own run and work folder; nothing is shared or resumed)
paths:
  project_root: <OUTPUT_DIR>/rpe1_<RUN_LABEL>
  raw_h5ad: ''
  processed_dir: processed
  splits_dir: splits
  figures_dir: figures
  log_dir: logs
dataset:
  name: RPE1_essential
  organism: human
  cell_type: RPE1
  perturbation_col: gene
  control_label: non-targeting
  perturbation_type: CRISPRi
  gene_id_format: symbol          # the raw RPE1 file on the cluster has gene symbols as var names
phase2_cell_triage:
  mt_method: explicit_list
  mt_threshold: 0.2
  mt_genes:
  - MT-ND1
  - MT-ND2
  - MT-ND3
  - MT-ND4
  - MT-ND4L
  - MT-ND5
  - MT-ND6
  - MT-CO1
  - MT-CO2
  - MT-CO3
  - MT-ATP6
  - MT-ATP8
  - MT-CYB
  ribo_prefixes:
  - RPL
  - RPS
  min_genes_per_cell: 200
  max_genes_per_cell: 10000
  min_counts_per_cell: 500
  max_counts_per_cell: 80000
phase5_escaper_filtering:
  efficiency_threshold: 0.5
  escaper_percentile: 10
  min_cells_per_perturbation: 50
  direction: auto
phase6_gene_triage:
  min_cells_expressing: 10
  pct_filter: 0.01
  mean_umi_threshold: 0.25
  rescue_perturbation_targets: true
  rescue_combinatorial_constituents: false
phase7_splits:
  mode: zero_shot
  random_seed: 42
  stratify_bins: 4
  test_n: 306
  val_n: 153
phase8_hvg:
  enabled: true
  n_top_genes: 5000
  method: seurat_v3
  rescue_perturbation_targets: true
  protected_gene_list: <SPORE_ROOT>/protected_genes/protected_genes_RPE1.json
  target_node_policy: budget
  max_target_nodes: 3500
phase9_normalization:
  target_sum: 10000
  log_transform: true
  method: lognorm
phase12_metacell:
  enabled: true
  mbk_k: 2
  seed: 42
output:
  cleanup_intermediates: false
  generate_report: true
xl:
  source:
    kind: h5ad_rows
    h5ad: <RPE1_H5AD>
    shard_rows: 40000
  work_dir: <SCRATCH_WORK_DIR>/rpe1_<RUN_LABEL>_work
  n_blocks: 16
  control_block_rows: 5000
  hvg_subsample_cells: 100000
  bucket_compression: lzf
  merge_split_outputs: never
  memory_budget_gb: 24
